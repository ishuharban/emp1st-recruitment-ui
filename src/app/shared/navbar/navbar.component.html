<nav class="navbar">
  <a class="logo" (click)="onLogoClick()" style="cursor: pointer;">
    <img class="logo-img" src="../../../assets/company-logo.png" alt="Company logo" />
  </a>

  <div class="nav-links">

    <!-- Recruitment mega-menu -->
    <div class="nav-item" [class.open]="isOpen('recruitment-menu')">
      <button class="nav-btn" [class.active-btn]="activeId === 'recruitment-menu'" (click)="toggle('recruitment-menu')">
        Recruitment
        <svg class="caret" viewBox="0 0 10 6" fill="none">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="dd-mega" *ngIf="isOpen('recruitment-menu')">
        <div class="mega-grid" style="grid-template-columns: 1fr">
          <div class="mega-col">
            <p class="sec-title">Recruitment</p>
            <ng-container *ngFor="let item of recruitmentItems; trackBy: trackByIndex">
              <a class="mega-link" style="cursor: pointer;" (click)="onRecruitmentItemClick(item.view)">
                <span class="link-icon" [ngClass]="'icon-' + item.icon">
                  <svg *ngIf="item.icon === 'chart'" viewBox="0 0 20 20" fill="none"><rect x="2" y="10" width="3" height="8" rx="1" fill="currentColor"/><rect x="8" y="6" width="3" height="12" rx="1" fill="currentColor"/><rect x="14" y="2" width="3" height="16" rx="1" fill="currentColor"/></svg>
                  <svg *ngIf="item.icon === 'file'" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l4 4v11H5V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 3v4h4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                  <svg *ngIf="item.icon === 'settings'" viewBox="0 0 20 20" fill="none"><path d="M4 6h12M4 10h12M4 14h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                  <svg *ngIf="item.icon === 'calendar'" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 2v2M13 2v2M3 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                  <svg *ngIf="item.icon === 'star'" viewBox="0 0 20 20" fill="none"><path d="M10 2l2.3 4.6 5.1.7-3.7 3.6.9 5.1L10 13.6l-4.6 2.4.9-5.1L2.6 7.3l5.1-.7L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                </span>
                <span class="link-label">{{ item.label }}</span>
              </a>
            </ng-container>
          </div>
        </div>
      </div>
    </div>

    <!-- Approvals mega-menu -->
    <div class="nav-item" [class.open]="isOpen('approvals-menu')">
      <button class="nav-btn" [class.active-btn]="activeId === 'approvals-menu'" (click)="toggle('approvals-menu')">
        Approvals
        <svg class="caret" viewBox="0 0 10 6" fill="none">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="dd-mega approvals-mega" *ngIf="isOpen('approvals-menu')">
        <div class="mega-grid" style="grid-template-columns: 1fr">
          <div class="mega-col">
            <p class="sec-title">Recruitment</p>
            <a class="mega-link" (click)="onRequisitionApprovalClick()">
              <span class="link-icon icon-file">
                <svg viewBox="0 0 20 20" fill="none"><path d="M5 3h7l4 4v11H5V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 3v4h4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 10h4M8 13h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </span>
              <span class="link-label">Requisition Management</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Configuration mega-menu (horizontal, 3 columns) -->
    <div class="nav-item" [class.open]="isOpen('configuration')">
      <button class="nav-btn" [class.active-btn]="activeId === 'settings'" (click)="toggle('configuration')">
        Configuration
        <svg class="caret" viewBox="0 0 10 6" fill="none">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="dd-mega dd-wide" *ngIf="isOpen('configuration')">
        <div class="mega-grid" style="grid-template-columns: 1fr 1fr 1fr">

          <!-- Column 1: Recruitment Setup -->
          <div class="mega-col">
            <p class="sec-title">Recruitment Setup</p>
            <a class="mega-link" *ngFor="let item of configSection1; trackBy: trackByIndex" (click)="onSettingsItemClick(item.view)">
              <span class="link-icon icon-settings">
                <svg *ngIf="item.icon === 'settings'" viewBox="0 0 20 20" fill="none"><path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="1.5"/><path d="M17 10a1.5 1.5 0 0 1 .9-1.4l.6-.2a1 1 0 0 0 .3-1.7l-.7-.7a1.5 1.5 0 0 1-.4-1.5l.1-.6A1 1 0 0 0 16.6 3l-.6.1a1.5 1.5 0 0 1-1.5-.4l-.5-.5a1 1 0 0 0-1.7.3l-.2.6A1.5 1.5 0 0 1 10 4l-.6-.2a1 1 0 0 0-1.2.7l-.1.6A1.5 1.5 0 0 1 7.7 6.6l-.5.5a1 1 0 0 0 .3 1.6l.6.2A1.5 1.5 0 0 1 9 10l-.2.6a1 1 0 0 0 .7 1.2l.6.1a1.5 1.5 0 0 1 1.5.5l.5.5a1 1 0 0 0 1.6-.3l.2-.6A1.5 1.5 0 0 1 15.3 11l.5-.5a1 1 0 0 0-.3-1.6" stroke="currentColor" stroke-width="1.5"/></svg>
                <svg *ngIf="item.icon === 'chart'" viewBox="0 0 20 20" fill="none"><rect x="2" y="10" width="3" height="8" rx="1" fill="currentColor"/><rect x="8" y="6" width="3" height="12" rx="1" fill="currentColor"/><rect x="14" y="2" width="3" height="16" rx="1" fill="currentColor"/></svg>
              </span>
              <span class="link-label">{{ item.label }}</span>
            </a>
          </div>

          <!-- Column 2: Communication -->
          <div class="mega-col">
            <p class="sec-title">Communication</p>
            <a class="mega-link" *ngFor="let item of configSection2; trackBy: trackByIndex" (click)="onSettingsItemClick(item.view)">
              <span class="link-icon icon-bell">
                <svg *ngIf="item.icon === 'bell'" viewBox="0 0 20 20" fill="none"><path d="M10 3a6 6 0 0 0-6 6v3l-1.5 2.5h15L16 12V9a6 6 0 0 0-6-6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 17a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.5"/></svg>
                <svg *ngIf="item.icon === 'file'" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l4 4v11H5V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 3v4h4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              </span>
              <span class="link-label">{{ item.label }}</span>
            </a>
          </div>

          <!-- Column 3: Administration -->
          <div class="mega-col">
            <p class="sec-title">Administration</p>
            <a class="mega-link" *ngFor="let item of configSection3; trackBy: trackByIndex" (click)="onSettingsItemClick(item.view)">
              <span class="link-icon icon-user">
                <svg *ngIf="item.icon === 'user'" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <svg *ngIf="item.icon === 'clock'" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <svg *ngIf="item.icon === 'settings'" viewBox="0 0 20 20" fill="none"><path d="M4 6h12M4 10h12M4 14h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
              <span class="link-label">{{ item.label }}</span>
            </a>
          </div>

        </div>
      </div>
    </div>

  </div>

  <div class="nav-right">
    <button class="icon-btn notif-btn" title="Notifications">
      <svg viewBox="0 0 22 22" fill="none"><path d="M11 3a7 7 0 0 0-7 7v3.5L2.5 16h17L18 13.5V10a7 7 0 0 0-7-7Z" stroke="currentColor" stroke-width="1.8"/><path d="M9 18a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8"/></svg>
      <span class="notif-badge"></span>
    </button>
    <div class="user-menu-wrap">
      <div class="user-avatar">ST</div>
      <div class="user-dropdown">
        <button class="logout-btn" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>
