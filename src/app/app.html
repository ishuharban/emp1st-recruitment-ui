<div class="app-shell">
  <app-navbar (navigate)="handleNavigation($event)"></app-navbar>
  <main class="app-content">

    <!-- Dashboard -->
    <app-dashboard *ngIf="currentView === 'dashboard'"></app-dashboard>

    <!-- Configuration / Settings screens -->
    <app-settings
      *ngIf="['recruitment-settings','pipeline-setup','candidate-form-builder','match-analysis-setup','email-templates','interview-templates','user-invitation','workflow-config','integrations','automation-rules'].includes(currentView)"
      [view]="currentView">
    </app-settings>

    <!-- Recruitment screens -->
    <app-job-posting
      *ngIf="currentView === 'job-posting'"
      (navigate)="handleNavigation($event)">
    </app-job-posting>

    <app-candidate-pipeline
      *ngIf="currentView === 'candidate-pipeline'"
      (navigate)="handleNavigation($event)">
    </app-candidate-pipeline>

    <app-candidate-timeline
      *ngIf="currentView === 'candidate-timeline'"
      (navigate)="handleNavigation($event)">
    </app-candidate-timeline>

    <app-interview-management
      *ngIf="currentView === 'interview-management'"
      (navigate)="handleNavigation($event)">
    </app-interview-management>

    <app-candidate-documents
      *ngIf="currentView === 'candidate-documents'"
      (navigate)="handleNavigation($event)">
    </app-candidate-documents>

    <app-offer-management
      *ngIf="currentView === 'offer-management'"
      (navigate)="handleNavigation($event)">
    </app-offer-management>

    <!-- Access Control (Configuration) -->
    <app-access-control
      *ngIf="currentView === 'access-control'"
      (navigate)="handleNavigation($event)">
    </app-access-control>

    <!-- Requisition Management -->
    <app-requisition
      *ngIf="currentView === 'requisition'"
      [mode]="'request'"
      (navigateBack)="handleNavigation($event)">
    </app-requisition>

    <!-- Requisition Approval -->
    <app-requisition
      *ngIf="currentView === 'requisition-approval'"
      [mode]="'approval'"
      (navigateBack)="handleNavigation($event)">
    </app-requisition>

  </main>
</div>
